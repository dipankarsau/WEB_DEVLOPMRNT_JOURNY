<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Set the character encoding -->
    <meta charset="UTF-8">

    <!-- Make the webpage responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Set the webpage title -->
    <title>CSS Position</title>

    <!-- Connect HTML with CSS -->
    <link rel="stylesheet" href="../CSS/POSITION.CSS">
</head>

<body>

    <!-- Sticky element -->
    <header class="sticky">
        STICKY
    </header>


    <!-- Static element -->
    <div class="static-box">
        STATIC
    </div>


    <!-- Relative element -->
    <div class="relative-box">
        RELATIVE
    </div>


    <!-- Parent of the absolute element -->
    <div class="parent">

        <!-- Absolute element -->
        <div class="absolute-box">
            ABSOLUTE
        </div>

    </div>


    <!-- Extra content for scrolling -->
    <div class="content">
        <h1>CSS Position Property</h1>

        <p>
            Scroll down to see how fixed and sticky positioning work.
        </p>

        <p>
            CSS positioning is very useful for creating modern layouts.
        </p>

        <p>
            Keep scrolling to test the different position values.
        </p>
    </div>


    <!-- Fixed element -->
    <div class="fixed-box">
        FIXED
    </div>

</body>

</html>
