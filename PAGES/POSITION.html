<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Set the character encoding -->
    <meta charset="UTF-8">

    <!-- Make the website responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Set the title of the webpage -->
    <title>CSS Position</title>

    <!-- Connect the CSS file with HTML -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- =====================================
         STICKY POSITION
         ===================================== -->

    <!-- This element will stick to the top when scrolling -->
    <header class="sticky">
        I am Sticky
    </header>


    <!-- =====================================
         STATIC POSITION
         ===================================== -->

    <!-- Static is the default position -->
    <div class="static-box">
        Static Box
    </div>


    <!-- =====================================
         RELATIVE POSITION
         ===================================== -->

    <!-- This box will move from its original position -->
    <div class="relative-box">
        Relative Box
    </div>


    <!-- =====================================
         ABSOLUTE POSITION
         ===================================== -->

    <!-- Parent container -->
    <div class="parent">

        <!-- This element will be positioned absolutely -->
        <div class="absolute-box">
            Absolute Box
        </div>

    </div>


    <!-- Extra content to create scrolling -->
    <div class="content">

        <h2>Scroll Down</h2>

        <!-- Paragraph for testing scrolling -->
        <p>
            This is some extra content for testing
            sticky and fixed positioning.
        </p>

        <p>
            Keep scrolling to see how different
            CSS positions behave.
        </p>

        <p>
            CSS position is very useful in web development.
        </p>

    </div>


    <!-- =====================================
         FIXED POSITION
         ===================================== -->

    <!-- This box will stay fixed on the screen -->
    <div class="fixed-box">
        Fixed Box
    </div>


</body>

</html>
